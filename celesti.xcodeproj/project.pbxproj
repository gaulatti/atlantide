		830AF2590978105138BD3A13 /* Fix Framework Bundle IDs */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Fix Framework Bundle IDs";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# FFmpegKit/KSPlayer embedded frameworks may contain underscores in their\n# CFBundleIdentifier, which is rejected by Xcode's validation step on tvOS.\n# Replace underscores with hyphens and re-sign so the modified Info.plists\n# remain valid when installed on a real device.\nFRAMEWORKS_DIR=\"${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}\"\nif [ -d \"${FRAMEWORKS_DIR}\" ]; then\n  find \"${FRAMEWORKS_DIR}\" -name \"Info.plist\" -path \"*.framework/*\" -print0 | while IFS= read -r -d '' plist; do\n    id=$(/usr/libexec/PlistBuddy -c \"Print :CFBundleIdentifier\" \"${plist}\" 2>/dev/null)\n    if [ -n \"${id}\" ]; then\n      fixed=$(echo \"${id}\" | tr '_' '-')\n      if [ \"${id}\" != \"${fixed}\" ]; then\n        /usr/libexec/PlistBuddy -c \"Set :CFBundleIdentifier ${fixed}\" \"${plist}\"\n      fi\n    fi\n  done\n  if [ -n \"${EXPANDED_CODE_SIGN_IDENTITY}\" ]; then\n    find \"${FRAMEWORKS_DIR}\" -maxdepth 1 -name \"*.framework\" -print0 | while IFS= read -r -d '' framework; do\n      # Do not preserve the old identifier; let codesign read the updated\n      # bundle identifier from the patched Info.plist.\n      codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" \\\n               --preserve-metadata=entitlements,flags \\\n               --timestamp=none \"${framework}\"\n    done\n  fi\nfi\n";
		};
/* End PBXShellScriptBuildPhase section */


name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - name: Verify source and dependency contracts
        run: scripts/verify-source-contract.sh
      - name: Run resilience tests
        run: swift test
      - name: Configure private Sabella access
        id: sabella-auth
        env:
          SABELLA_READ_TOKEN: ${{ secrets.SABELLA_READ_TOKEN }}
        run: |
          if [[ -z "${SABELLA_READ_TOKEN}" ]]; then
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::SABELLA_READ_TOKEN is not configured; source contracts and tests ran, but remote package and tvOS build checks require that read-only credential."
            exit 0
          fi

          authorization="$(printf 'x-access-token:%s' "${SABELLA_READ_TOKEN}" | base64)"
          echo "::add-mask::${authorization}"
          git config --global http.https://github.com/.extraheader \
            "AUTHORIZATION: basic ${authorization}"
          echo "available=true" >> "${GITHUB_OUTPUT}"
      - name: Resolve the locked remote package graph
        if: steps.sabella-auth.outputs.available == 'true'
        run: |
          xcodebuild \
            -quiet \
            -resolvePackageDependencies \
            -project celesti.xcodeproj \
            -scheme celesti \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/SourcePackages"
      - name: Build the tvOS simulator application
        if: steps.sabella-auth.outputs.available == 'true'
        run: |
          xcodebuild \
            -quiet \
            -project celesti.xcodeproj \
            -scheme celesti \
            -sdk appletvsimulator \
            -configuration Debug \
            -derivedDataPath "${RUNNER_TEMP}/SimulatorDerivedData" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/SourcePackages" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            ATLANTIDE_GIT_SHA="${GITHUB_SHA}" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
      - name: Build and inspect the unsigned Release application
        if: steps.sabella-auth.outputs.available == 'true'
        run: |
          xcodebuild \
            -quiet \
            -project celesti.xcodeproj \
            -scheme celesti \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "${RUNNER_TEMP}/ReleaseDerivedData" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/SourcePackages" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            ATLANTIDE_GIT_SHA="${GITHUB_SHA}" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
          scripts/verify-internal-app.sh \
            "${RUNNER_TEMP}/ReleaseDerivedData/Build/Products/Release-appletvos/celesti.app" \
            1.0 1 "${GITHUB_SHA}" unsigned
      - name: Remove private package credentials
        if: always()
        run: |
          git config --global --unset-all http.https://github.com/.extraheader || true
